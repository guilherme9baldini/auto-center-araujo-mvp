{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between mb-4">
    <h2>Clientes</h2>
    <a href="{% url 'clientes:cadastrar' %}" class="btn btn-primary">
        Novo cliente
    </a>
</div>

<table class="table table-bordered bg-white">
    <thead>
        <tr>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Veículo</th>
        </tr>
    </thead>
    <tbody>
        {% for cliente in clientes %}
        <tr>
            <td>{{ cliente.nome }}</td>
            <td>{{ cliente.telefone }}</td>
            <td>{{ cliente.veiculo|default:"Não informado" }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3">Nenhum cliente cadastrado.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
