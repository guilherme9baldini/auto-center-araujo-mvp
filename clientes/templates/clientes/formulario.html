{% extends "base.html" %}

{% block content %}

<h2>Novo cliente</h2>
<p class="text-muted">Preencha os dados abaixo para cadastrar um cliente.</p>

<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Salvar cliente
    </button>
    <a href="{% url 'clientes:listar' %}" class="btn btn-secondary mt-2">
        Voltar
    </a>
</form>

{% endblock %}
