{% extends "base.html" %}

{% block content %}

<h2>Registrar entrada ou saída</h2>
<p class="text-muted">Selecione o produto e informe se deseja adicionar ou retirar unidades do estoque.</p>

<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        Registrar movimentação
    </button>
    <a href="{% url 'estoque:listar' %}" class="btn btn-secondary mt-2">
        Voltar
    </a>
</form>

{% endblock %}
