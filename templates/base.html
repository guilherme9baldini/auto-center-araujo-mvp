<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auto Center Araújo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
body {
    background: #f8f9fa;
    color: #212529;
}

/* Alto contraste: somente quando ativado */
body.alto-contraste {
    background: #000 !important;
    color: #fff !important;
}

.alto-contraste h1,
.alto-contraste h2,
.alto-contraste h3,
.alto-contraste p,
.alto-contraste label,
.alto-contraste a,
.alto-contraste span {
    color: #fff !important;
}

/* Tabelas: fundo preto e texto branco */
.alto-contraste .table {
    --bs-table-bg: #000;
    --bs-table-color: #fff;
    --bs-table-striped-bg: #202020;
    --bs-table-striped-color: #fff;
    --bs-table-hover-bg: #333;
    --bs-table-hover-color: #fff;
    --bs-table-border-color: #ff0;
}

.alto-contraste .table > :not(caption) > * > * {
    background-color: #000 !important;
    color: #fff !important;
    border-color: #ff0 !important;
}

/* Cabeçalhos das tabelas */
.alto-contraste .table thead th {
    background-color: #222 !important;
    color: #ff0 !important;
}

/* Campos */
.alto-contraste input,
.alto-contraste select,
.alto-contraste textarea {
    background: #000 !important;
    color: #fff !important;
    border: 2px solid #ff0 !important;
}

/* Botões */
.alto-contraste .btn {
    background: #ff0 !important;
    color: #000 !important;
    border: 2px solid #fff !important;
    font-weight: bold;
}

/* Foco acessível pelo teclado */
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: 3px solid #ff0 !important;
    outline-offset: 3px;
}
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Auto Center Araújo</a>

        <div class="d-flex flex-wrap gap-2">
            <a class="btn btn-outline-light btn-sm" href="/estoque/">
                Estoque
            </a>

            <a class="btn btn-outline-light btn-sm" href="/clientes/">
                Clientes
            </a>

            <button
                id="botaoContraste"
                class="btn btn-warning btn-sm"
                type="button"
                aria-pressed="false"
                onclick="alternarContraste()">
                Ativar alto contraste
            </button>
        </div>
    </div>
</nav>

<main class="container mt-4">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<script>
    function aplicarContraste(ativado) {
        document.body.classList.toggle("alto-contraste", ativado);

        const botao = document.getElementById("botaoContraste");

        botao.textContent = ativado
            ? "Desativar alto contraste"
            : "Ativar alto contraste";

        botao.setAttribute("aria-pressed", ativado);
    }

    function alternarContraste() {
        const ativado = !document.body.classList.contains("alto-contraste");

        localStorage.setItem("altoContraste", ativado);
        aplicarContraste(ativado);
    }

    aplicarContraste(localStorage.getItem("altoContraste") === "true");
</script>

</body>
</html>
